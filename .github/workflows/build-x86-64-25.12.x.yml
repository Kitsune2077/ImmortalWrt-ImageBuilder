name: Build 25.12.x x86-64
on:
  workflow_dispatch:
    inputs:
      luci_version:
        description: "选择luci版本"
        required: false
        default: "25.12.1"
        type: choice
        options:
          - 25.12.0
          - 25.12.1
          - 25.12.2
      custom_router_ip:
        description: "请设置路由器的管理地址(仅对多网口路由器有效) 格式:192.168.x.1 或 10.x.x.1"
        required: true
        default: "192.168.100.1"
      profile:
        description: '选择软件包空间大小'
        required: true
        type: choice
        default: '1G'
        options:
          - '1G'
          - '2G'
          - '3G'
          - '4G'
      enable_store:
        description: "集成 store 商店"
        required: false
        type: boolean
        default: false
      include_docker:
        description: |
          是否编译 Docker 插件
        required: true
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'
      enable_pppoe:
        description: "是否配置PPPoE拨号信息?"
        required: true
        default: 'no'
        type: choice
        options:
        - 'yes'
        - 'no'
      pppoe_account:
        description: "宽带账号 (若启用PPPoE)"
        required: false
      pppoe_password:
        description: "宽带密码 (若启用PPPoE)"
        required: false
      enable_ipv6:
        description: "按 Aethersailor 方案启用 IPv6 (WAN 委托前缀 + LAN RA/SLAAC; 多网口生效)"
        required: true
        default: 'no'
        type: choice
        options:
          - 'yes'
          - 'no'
      ipv6_assign:
        description: "LAN IPv6 分配长度 (上游只给 /64 用 64; 向二级路由委派用 60/56)"
        required: false
        default: '64'
        type: choice
        options:
          - '64'
          - '60'
          - '56'
          - 'disabled'
      ipv6_ifaceid:
        description: "路由器 LAN 接口自身 IPv6 后缀 (不影响客户端)"
        required: false
        default: 'eui64'
        type: choice
        options:
          - 'eui64'
          - 'random'
          - '::1'
      ipv6_dhcpv6:
        description: "LAN DHCPv6 (disabled=纯SLAAC兼容安卓; server=有状态分配)"
        required: false
        default: 'disabled'
        type: choice
        options:
          - 'disabled'
          - 'server'
      ipv6_dns:
        description: "向客户端通告路由器为 IPv6 DNS (no=DNS 走 IPv4, 保住代理分流)"
        required: false
        default: 'no'
        type: choice
        options:
          - 'yes'
          - 'no'
      enable_ap_modem:
        description: "安装 luci-app-ap-modem (访问 WAN 口光猫/AP, 来自 iStoreOS 官方源预编译包)"
        required: true
        default: 'no'
        type: choice
        options:
          - 'yes'
          - 'no'
      ap_modem_enabled:
        description: "开启访问 WAN 口光猫 (仅安装插件时生效)"
        required: false
        default: 'no'
        type: choice
        options:
          - 'yes'
          - 'no'
      ap_modem_ip:
        description: "光猫 IP 地址 (仅安装插件时生效)"
        required: false
        default: "192.168.1.1"
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set executable permissions
        run: chmod +x ${{ github.workspace }}/x86-64/build25.sh

      - name: Save Custom Router IP into OpenWrt files
        run: |
          mkdir -p "${{ github.workspace }}/custom"
          echo "${{ github.event.inputs.custom_router_ip }}" > "${{ github.workspace }}/custom/custom_router_ip.txt"
          echo "您设置的路由器管理地址是:${{ github.event.inputs.custom_router_ip }}"
          # 后续步骤会将该文件映射到路由器/etc/config/custom_router_ip.txt 以便用于开机脚本99-custom.sh读取用户设置的ip
      
      - name: Validate PPPoE Inputs
        run: |
          if [[ "${{ inputs.enable_pppoe }}" == "yes" ]]; then
            if [[ -z "${{ inputs.pppoe_account }}" || -z "${{ inputs.pppoe_password }}" ]]; then
              echo "Error: PPPoE account and password must be provided when PPPoE is enabled!"
              exit 1
            fi
          fi
      
      - name: Prepare luci-app-ap-modem (optional)
        run: |
          mkdir -p "${{ github.workspace }}/apk-extra/ap-modem"
          if [ "${{ github.event.inputs.enable_ap_modem }}" != "yes" ]; then
            echo "ap-modem 未启用, 跳过"
            exit 0
          fi
          if [ "${{ github.event.inputs.ap_modem_enabled }}" = "yes" ]; then
            echo "${{ github.event.inputs.ap_modem_ip }}" | grep -qE '^([0-9]{1,3}\.){3}[0-9]{1,3}$' \
              || { echo "::error::光猫 IP 格式非法: ${{ github.event.inputs.ap_modem_ip }}"; exit 1; }
          fi
          # iStoreOS 官方 apk 包 (arch=all), 放入 extra-packages/ap-modem/,
          # 由 build.sh 经 apk-prepare-packages.sh 收进本地 packages/ 源正规安装
          fetch() {
            curl -fL --retry 3 -o "/tmp/$1" "$2" || { echo "::error::$1 下载失败"; exit 1; }
            echo "$3  /tmp/$1" | sha256sum -c - || { echo "::error::$1 SHA256 校验失败"; exit 1; }
          }
          # apk 按索引记录的名字从本地源取文件: 文件名必须保持 包名-完整版本.apk 原样,
          # 截短会报 "package mentioned in index not found"
          fetch luci-app-ap-modem-1.0.5-r20241208.apk \
            "https://istore.istoreos.com/repo-apk/all/nas_luci/luci-app-ap-modem-1.0.5-r20241208.apk" \
            "0ea5a437836f00e75500df04ffc86b8834edd45d8179fbcbb09f02859056834e"
          fetch luci-i18n-ap-modem-zh-cn-23.098.14018~0543d43.apk \
            "https://istore.istoreos.com/repo-apk/all/nas_luci/luci-i18n-ap-modem-zh-cn-23.098.14018~0543d43.apk" \
            "e5650cddf6a707c9e09db1eb9ef387562da00655a80c5add47e296f7d7f1e0cd"
          # istore 官方 apk 公钥: IB 默认开启签名检查(CONFIG_SIGNATURE_CHECK=y),
          # build.sh 会将其导入 keys/, 否则 istore 签名的包 UNTRUSTED 安装失败
          fetch istore-apk.pem \
            "https://istore.istoreos.com/repo-apk/istore-apk.pem" \
            "17d39c124a39a0f0bf54601073ddb3d42bad45b40be9ad28c17e805bee04db08"
          cp /tmp/istore-apk.pem "${{ github.workspace }}/apk-extra/"
          cp "/tmp/luci-app-ap-modem-1.0.5-r20241208.apk" "/tmp/luci-i18n-ap-modem-zh-cn-23.098.14018~0543d43.apk" \
             "${{ github.workspace }}/apk-extra/ap-modem/"
          ls -la "${{ github.workspace }}/apk-extra/ap-modem/"

      - name: Enable Store integration
        run: |
          if [ "${{ github.event.inputs.enable_store }}" == "true" ]; then
            echo 'CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-store"' >> shell/apk-custom-packages.sh
            echo "✅ 已追加 luci-app-store"
          else
            echo "❎ 未启用 luci-app-store"
          fi

      - name: Build ImmortalWrt-x86-64-efi 25.12.x
        run: |
          profile="${{ github.event.inputs.profile }}"
          case "$profile" in
            1G)
              ROOTFS_SIZE=1024
              ;;
            2G)
              ROOTFS_SIZE=2048
              ;;
            3G)
              ROOTFS_SIZE=3072
              ;;
            4G)
              ROOTFS_SIZE=4096
              ;;
          esac
          echo "ROOTFS_SIZE=$ROOTFS_SIZE" >> $GITHUB_ENV
          include_docker="${{ github.event.inputs.include_docker }}"
          luci_version="${{ github.event.inputs.luci_version }}"
          echo "Building for rootfs_size: $profile"
          docker run --rm -i \
            --user root \
            -v "${{ github.workspace }}/bin:/home/build/immortalwrt/bin" \
            -v "${{ github.workspace }}/files:/home/build/immortalwrt/files" \
            -v "${{ github.workspace }}/custom:/home/build/immortalwrt/files/etc/config" \
            -v "${{ github.workspace }}/x86-64/imm25.config:/home/build/immortalwrt/.config" \
            -v "${{ github.workspace }}/shell:/home/build/immortalwrt/shell" \
            -v "${{ github.workspace }}/x86-64/build25.sh:/home/build/immortalwrt/build.sh" \
            -v "${{ github.workspace }}/apk-extra:/home/build/immortalwrt/extra-packages" \
            -e PROFILE=$ROOTFS_SIZE \
            -e INCLUDE_DOCKER=$include_docker \
            -e ENABLE_PPPOE=${{ inputs.enable_pppoe }} \
            -e PPPOE_ACCOUNT=${{ inputs.pppoe_account }} \
            -e PPPOE_PASSWORD=${{ inputs.pppoe_password }} \
            -e ENABLE_IPV6=${{ github.event.inputs.enable_ipv6 }} \
            -e IPV6_ASSIGN=${{ github.event.inputs.ipv6_assign }} \
            -e IPV6_IFACEID=${{ github.event.inputs.ipv6_ifaceid }} \
            -e IPV6_DHCPV6=${{ github.event.inputs.ipv6_dhcpv6 }} \
            -e IPV6_DNS=${{ github.event.inputs.ipv6_dns }} \
            -e ENABLE_AP_MODEM=${{ github.event.inputs.enable_ap_modem }} \
            -e AP_MODEM_ENABLED=${{ github.event.inputs.ap_modem_enabled }} \
            -e AP_MODEM_IP=${{ github.event.inputs.ap_modem_ip }} \
          immortalwrt/imagebuilder:x86-64-openwrt-${luci_version} /bin/bash /home/build/immortalwrt/build.sh
          

      - name: Create info
        run: |
          cat > ${{ github.workspace }}/router-info.md <<EOF
          ## 📡 路由器后台信息
          <a href="https://wkdaily.cpolar.cn/archives/1">
           <img src="https://img.shields.io/badge/若下载慢可套用国内加速站下载-FC7C0D?logo=github&logoColor=fff&labelColor=000&style=for-the-badge"/>
          </a>
          
          - 🏠 **后台地址**: ${{ github.event.inputs.custom_router_ip }}
          - 👤 **用户名**: root
          - 🔑 **密码**: 无
          EOF

          if [ "${{ github.event.inputs.include_docker }}" == "yes" ]; then
            extra_content="#### 默认带docker"
            echo -e "\n$extra_content" >> ${{ github.workspace }}/router-info.md
          else
            echo -e "\n#### 不带docker" >> ${{ github.workspace }}/router-info.md
          fi

      - name: Upload ImmortWrt as release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: Autobuild-x86-64
          body_path: ${{ github.workspace }}/router-info.md
          files: |
            ${{ github.workspace }}/bin/targets/x86/64/*squashfs-combined-efi.img.gz
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
