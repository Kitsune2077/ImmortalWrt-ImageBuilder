# 此工作流是为了构建一个immortalwrt固件的安装器 格式为iso 可用于所有的虚拟机 和 物理机
# 所谓安装器就是用来安装用的 iso引导的是一个启动速度极快的debian live系统 跑码后输入命令 ddd 即可调出安装菜单
# 安装时 若是多张硬盘 你可以选择 需要安装的硬盘 此类方法安装的openwrt 安装后是有剩余空间的 更多信息请参考 wukongdaily/img-installer 项目
# 几乎所有linux 都有各自的安装器 唯独openwrt和armbian 没有, 希望此工作流 弥补这个遗憾 让你更优雅的 安装openwrt 

name: Build 24.10.x ISO x86-64

on:
  workflow_dispatch:
    inputs:
      luci_version:
        description: "选择luci版本"
        required: false
        default: "24.10.6"
        type: choice
        options:
          - 24.10.0
          - 24.10.1
          - 24.10.2
          - 24.10.3
          - 24.10.4
          - 24.10.5
          - 24.10.6
      profile:
        description: '选择软件包空间大小'
        required: true
        type: choice
        default: '1G'
        options:
          - '1G'
          - '2G'
          - '3G'
          - '4G'
      include_docker:
        description: "是否编译 Docker 插件"
        required: true
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'
      enable_store:
        description: "集成 store 商店"
        required: false
        type: boolean
        default: true
      enable_pppoe:
        description: "是否配置PPPoE拨号信息?"
        required: true
        default: 'no'
        type: choice
        options:
          - 'yes'
          - 'no'
      pppoe_account:
        description: "宽带账号 (若启用PPPoE)"
        required: false
      pppoe_password:
        description: "宽带密码 (若启用PPPoE)"
        required: false
      enable_ipv6:
        description: "按 Aethersailor 方案启用 IPv6 (WAN 委托前缀 + LAN RA/SLAAC; 多网口生效)"
        required: true
        default: 'no'
        type: choice
        options:
          - 'yes'
          - 'no'
      ipv6_assign:
        description: "LAN IPv6 分配长度 (上游只给 /64 用 64; 向二级路由委派用 60/56)"
        required: false
        default: '64'
        type: choice
        options:
          - '64'
          - '60'
          - '56'
          - 'disabled'
      ipv6_ifaceid:
        description: "路由器 LAN 接口自身 IPv6 后缀 (不影响客户端)"
        required: false
        default: 'eui64'
        type: choice
        options:
          - 'eui64'
          - 'random'
          - '::1'
      ipv6_dhcpv6:
        description: "LAN DHCPv6 (disabled=纯SLAAC兼容安卓; server=有状态分配)"
        required: false
        default: 'disabled'
        type: choice
        options:
          - 'disabled'
          - 'server'
      ipv6_dns:
        description: "向客户端通告路由器为 IPv6 DNS (no=DNS 走 IPv4, 保住代理分流)"
        required: false
        default: 'no'
        type: choice
        options:
          - 'yes'
          - 'no'
      enable_ap_modem:
        description: "安装 luci-app-ap-modem (访问 WAN 口光猫/AP, 来自 iStoreOS 官方源预编译包)"
        required: true
        default: 'no'
        type: choice
        options:
          - 'yes'
          - 'no'
      ap_modem_enabled:
        description: "开启访问 WAN 口光猫 (仅安装插件时生效)"
        required: false
        default: 'no'
        type: choice
        options:
          - 'yes'
          - 'no'
      ap_modem_ip:
        description: "光猫 IP 地址 (仅安装插件时生效)"
        required: false
        default: "192.168.1.1"
        type: string
      install_daede:
        description: "首启自动安装 openwrt-daede (dae/daed 代理; 官方一键安装脚本, 联网后后台执行, 日志 /root/daede-install.log)"
        required: true
        default: 'no'
        type: choice
        options:
          - 'yes'
          - 'no'

permissions:
  contents: write

jobs:
  build_immortalwrt:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set executable permissions
        run: chmod +x ${{ github.workspace }}/x86-64/build24.sh
      
      - name: Prepare luci-app-ap-modem (optional)
        run: |
          mkdir -p "${{ github.workspace }}/apk-extra/ap-modem"
          if [ "${{ github.event.inputs.enable_ap_modem }}" != "yes" ]; then
            echo "ap-modem 未启用, 跳过"
            exit 0
          fi
          if [ "${{ github.event.inputs.ap_modem_enabled }}" = "yes" ]; then
            echo "${{ github.event.inputs.ap_modem_ip }}" | grep -qE '^([0-9]{1,3}\.){3}[0-9]{1,3}$' \
              || { echo "::error::光猫 IP 格式非法: ${{ github.event.inputs.ap_modem_ip }}"; exit 1; }
          fi
          # iStoreOS 官方 ipk 包 (arch=all, opkg 时代), 放入 extra-packages/ap-modem/,
          # 由 build.sh 经 prepare-packages.sh 收进本地 packages/ 源正规安装
          fetch() {
            curl -fL --retry 3 -o "/tmp/$1" "$2" || { echo "::error::$1 下载失败"; exit 1; }
            echo "$3  /tmp/$1" | sha256sum -c - || { echo "::error::$1 SHA256 校验失败"; exit 1; }
          }
          fetch luci-app-ap-modem.ipk \
            "https://istore.istoreos.com/repo/all/nas_luci/luci-app-ap-modem_1.0.5-20241208_all.ipk" \
            "a1a0a8e672a3fe83d144999c735b39ea04b011a7dfc2d384cdb4db77f20bec21"
          fetch luci-i18n-ap-modem-zh-cn.ipk \
            "https://istore.istoreos.com/repo/all/nas_luci/luci-i18n-ap-modem-zh-cn_git-23.098.14018-0543d43_all.ipk" \
            "ba6292cce69b6bb68ce58959b9058c99e502b52680de83e71d7a2fda7f50c7f5"
          cp /tmp/luci-app-ap-modem.ipk /tmp/luci-i18n-ap-modem-zh-cn.ipk \
             "${{ github.workspace }}/apk-extra/ap-modem/"
          ls -la "${{ github.workspace }}/apk-extra/ap-modem/"

      - name: Enable Store integration
        run: |
          if [ "${{ github.event.inputs.enable_store }}" == "true" ]; then
            echo 'CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-store"' >> shell/custom-packages.sh
            echo "✅ 已追加 luci-app-store"
          else
            echo "❎ 未启用 luci-app-store"
          fi

      - name: Validate PPPoE Inputs
        run: |
          if [[ "${{ github.event.inputs.enable_pppoe }}" == "yes" ]]; then
            if [[ -z "${{ github.event.inputs.pppoe_account }}" || -z "${{ github.event.inputs.pppoe_password }}" ]]; then
              echo "Error: PPPoE account and password must be provided when PPPoE is enabled!"
              exit 1
            fi
          fi

      - name: ✅ 正在构建ImmortalWrt固件
        run: |
          profile="${{ github.event.inputs.profile }}"
          case "$profile" in
            1G)
              ROOTFS_SIZE=1024
              ;;
            2G)
              ROOTFS_SIZE=2048
              ;;
            3G)
              ROOTFS_SIZE=3072
              ;;
            4G)
              ROOTFS_SIZE=4096
              ;;
          esac
          echo "ROOTFS_SIZE=$ROOTFS_SIZE" >> $GITHUB_ENV
          include_docker="${{ github.event.inputs.include_docker }}"
          luci_version="${{ github.event.inputs.luci_version }}"
          echo "Building for rootfs_size: $profile"
          docker run --rm -i \
              --user root \
              -v "${{ github.workspace }}/bin:/home/build/immortalwrt/bin" \
              -v "${{ github.workspace }}/files:/home/build/immortalwrt/files" \
              -v "${{ github.workspace }}/x86-64/imm.config:/home/build/immortalwrt/.config" \
              -v "${{ github.workspace }}/shell:/home/build/immortalwrt/shell" \
              -v "${{ github.workspace }}/x86-64/build24.sh:/home/build/immortalwrt/build.sh" \
              -v "${{ github.workspace }}/apk-extra:/home/build/immortalwrt/extra-packages" \
              -e PROFILE=$ROOTFS_SIZE \
              -e INCLUDE_DOCKER=$include_docker \
              -e ENABLE_PPPOE=${{ inputs.enable_pppoe }} \
              -e PPPOE_ACCOUNT=${{ inputs.pppoe_account }} \
              -e PPPOE_PASSWORD=${{ inputs.pppoe_password }} \
              -e ENABLE_IPV6=${{ github.event.inputs.enable_ipv6 }} \
              -e IPV6_ASSIGN=${{ github.event.inputs.ipv6_assign }} \
              -e IPV6_IFACEID=${{ github.event.inputs.ipv6_ifaceid }} \
              -e IPV6_DHCPV6=${{ github.event.inputs.ipv6_dhcpv6 }} \
              -e IPV6_DNS=${{ github.event.inputs.ipv6_dns }} \
              -e ENABLE_AP_MODEM=${{ github.event.inputs.enable_ap_modem }} \
              -e AP_MODEM_ENABLED=${{ github.event.inputs.ap_modem_enabled }} \
              -e AP_MODEM_IP=${{ github.event.inputs.ap_modem_ip }} \
              -e ENABLE_DAEDE=${{ github.event.inputs.install_daede }} \
          immortalwrt/imagebuilder:x86-64-openwrt-${luci_version} /bin/bash /home/build/immortalwrt/build.sh
         

      - name: ✅ 复制固件到根目录
        run: |
          cp ${{ github.workspace }}/bin/targets/x86/64/*squashfs-combined-efi.img.gz ${{ github.workspace }}

      - name: ✅ 上传固件到 artifact (for ISO generation)
        uses: actions/upload-artifact@v6
        with:
          name: firmware-img
          path: |
            *.img.gz

  build_installer_iso:
    runs-on: ubuntu-22.04
    needs: build_immortalwrt

    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@v7
        with:
          name: firmware-img

      - name: ⏬ 同步 img-installer 项目 准备制作ISO
        run: |
          git clone https://github.com/wukongdaily/img-installer.git
          cd img-installer

      - name: Set executable permissions for scripts
        run: |
          chmod +x "${{ github.workspace }}/img-installer/custom.sh"
          chmod +x "${{ github.workspace }}/img-installer/supportFiles/custom/build.sh"

      - name: ✅ 制作 ISO
        run: |
          firmware_file=$(ls *squashfs-combined-efi.img.gz)
          cd img-installer
          bash autobuild/autobuild.sh "../$firmware_file"

      - name: 🚀 上传 ISO 到 Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "Custom-Installer-x86_64-ISO"
          body_path: "${{ github.workspace }}/img-installer/autobuild/info.md"
          files: |
            img-installer/output/custom-installer-x86_64.iso
          token: "${{ secrets.GITHUB_TOKEN }}"
